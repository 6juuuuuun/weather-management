# gitleaks 설정. 사내 보안 스캔(gitleaks)이 이 저장소를 훑을 때 쓴다.
#
# **원칙:** 진짜 비밀값은 예외로 덮지 않는다. 예외는 "공개된 값임을 증명할 수 있는
# 것"에만 붙이고, 왜 그런지를 여기에 적는다. 근거 없는 예외는 스캐너를 무력화하는
# 것과 같고, 그러면 진짜 유출이 났을 때도 조용히 통과한다.

[extend]
useDefault = true

# 규칙은 **재정의하지 않는다.** 한 번 같은 id로 규칙을 다시 쓴 적이 있는데,
# 기본 규칙이 통째로 대체되면서 잡히던 것(.pen의 fileToken)이 조용히 사라졌다.
# 예외는 아래 allowlist로만 좁게 준다.

[[allowlists]]
description = """
Supabase 로컬 개발용 데모 키. `supabase start`가 출력하는 값으로, 전 세계 모든
설치가 같은 문자열을 받는다 — Supabase가 문서에 공개해 둔 고정 값이다.
프로덕션 키가 아니고, 그 파일(.env.test.example) 자신이 첫 줄에 그렇게 적어 두었다.
자체 호스팅으로 이관하면서 Supabase를 걷어냈고 그 파일도 지웠지만, gitleaks는
이력을 훑으므로 여기서 예외로 둔다.
"""
paths = ['''^\.env\.test\.example$''']

[[allowlists]]
description = """
로컬 개발용 고정 문자열. 실제 서버에 쓰이지 않는 값이며, .env(진짜 값이 들어가는
파일)는 .gitignore 대상이라 저장소에 들어오지 않는다.
"""
regexes = [
  '''CRON_SECRET\s*=\s*["']?test-secret''',
  '''(?i)password["'\s:=]{1,3}["']?(test|example|changeme|<random string>)''',
]
